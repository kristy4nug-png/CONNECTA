name: Release and Deploy

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dev dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release ZIP
        run: |
          mkdir -p releases
          zip -r "releases/atlas-web-$(node -p \"require('./package.json').version\")-$(date -u +%Y%m%d).zip" index.html privacy.html manifest.webmanifest service-worker.js app-version.json assets icons *.js

      - name: Prepare gh-pages folder
        run: |
          rm -rf releases/gh-pages || true
          mkdir -p releases/gh-pages
          cp -r index.html privacy.html *.js manifest.webmanifest service-worker.js app-version.json assets icons releases/gh-pages

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./releases/gh-pages
          publish_branch: gh-pages
